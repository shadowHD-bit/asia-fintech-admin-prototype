    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <div class="app-shell">
      <!-- ============ Sidebar ============ -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <img class="sidebar-brand-mark" src="assets/images/logo-icon.svg" alt="Asia Fintech" />
          <div class="sidebar-brand-text">
            <span class="sidebar-brand-title">
              <span class="brand-word">Asia</span> <span class="brand-word-accent">Fintech</span>
            </span>
            <span class="sidebar-brand-subtitle" id="sidebar-brand-subtitle">Бэк-офис</span>
          </div>
        </div>

        <button type="button" class="sidebar-collapse-btn" id="sidebar-collapse-btn" title="Свернуть меню">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 6.5 10l6 5.5"/></svg>
        </button>

        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <nav class="sidebar-nav-pinned" id="sidebar-nav-pinned"></nav>
      </aside>

      <!-- ============ Main column ============ -->
      <div class="main-column">
        <header class="navbar">
          <div class="navbar-left">
            <button type="button" class="navbar-home-btn navbar-back-btn" id="navbar-back-btn" title="" hidden>
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 6.5 10l6 5.5"/></svg>
            </button>
            <button type="button" class="navbar-home-btn" id="navbar-home-btn" title="">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 10 3l7 6.5"/><path d="M5 8.5V17h10V8.5"/><path d="M8 17v-4.5h4V17"/></svg>
            </button>
            <nav class="breadcrumbs" id="breadcrumbs"></nav>
          </div>

          <div class="navbar-right">
           <div class="navbar-account">
            <div class="lang-dropdown" id="lang-dropdown">
              <button type="button" class="lang-dropdown-trigger" id="lang-dropdown-trigger">
                <span class="flag-icon" id="lang-dropdown-flag">
                  <svg viewBox="0 0 20 14" width="100%" height="100%"><rect width="20" height="14" fill="#fff"/><rect y="4.67" width="20" height="9.33" fill="#0039A6"/><rect y="9.33" width="20" height="4.67" fill="#D52B1E"/></svg>
                </span>
                <span id="lang-dropdown-current">RU</span>
                <svg class="lang-dropdown-trigger-caret" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 8 4 4 4-4"/></svg>
              </button>

              <div class="lang-dropdown-menu" id="lang-dropdown-menu">
                <div class="lang-dropdown-label" id="lang-dropdown-label">Язык интерфейса</div>

                <button type="button" class="lang-dropdown-item is-active" data-lang="ru">
                  <span class="lang-dropdown-item-label">
                    <span class="flag-icon">
                      <svg viewBox="0 0 20 14" width="100%" height="100%"><rect width="20" height="14" fill="#fff"/><rect y="4.67" width="20" height="9.33" fill="#0039A6"/><rect y="9.33" width="20" height="4.67" fill="#D52B1E"/></svg>
                    </span>
                    <span class="lang-dropdown-item-names"><span>Русский</span><span class="lang-dropdown-item-sub">Russian</span></span>
                  </span>
                  <svg class="lang-dropdown-check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 10.5 3.3 3.3L15.5 6.5"/></svg>
                </button>
                <button type="button" class="lang-dropdown-item" data-lang="en">
                  <span class="lang-dropdown-item-label">
                    <span class="flag-icon">
                      <svg viewBox="0 0 60 30" width="100%" height="100%"><rect width="60" height="30" fill="#00247d"/><g stroke="#fff" stroke-width="6"><path d="M0,0 L60,30 M60,0 L0,30"/></g><g stroke="#cf142b" stroke-width="2"><path d="M0,0 L60,30 M60,0 L0,30"/></g><g stroke="#fff" stroke-width="10"><path d="M30,0 V30 M0,15 H60"/></g><g stroke="#cf142b" stroke-width="6"><path d="M30,0 V30 M0,15 H60"/></g></svg>
                    </span>
                    <span class="lang-dropdown-item-names"><span>English</span><span class="lang-dropdown-item-sub">English (UK)</span></span>
                  </span>
                  <svg class="lang-dropdown-check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 10.5 3.3 3.3L15.5 6.5"/></svg>
                </button>
              </div>
            </div>

            <div class="navbar-divider"></div>

            <div class="navbar-user" id="navbar-user">
              <div class="navbar-user-avatar" id="navbar-user-avatar"></div>
              <div class="navbar-user-meta">
                <span class="navbar-user-name" id="navbar-user-name"></span>
                <span class="navbar-user-role" id="navbar-user-role"></span>
              </div>
              <svg class="navbar-user-caret" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 8 4 4 4-4"/></svg>

              <div class="user-menu" id="user-menu">
                <button type="button" class="user-menu-item" data-action="profile">
                  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7" r="3"/><path d="M4 17c.6-3.6 2.9-5.5 6-5.5s5.4 1.9 6 5.5"/></svg>
                  <span id="user-menu-profile-label">Профиль</span>
                </button>
                <div class="user-menu-divider"></div>
                <button type="button" class="user-menu-item is-danger" data-action="logout">
                  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 14v.5a2 2 0 0 1-2 2h-5a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v.5"/><path d="M8 10h9M14 6.5 17.5 10 14 13.5"/></svg>
                  <span id="user-menu-logout-label">Выйти</span>
                </button>
              </div>
            </div>
           </div>
          </div>
        </header>

        <main class="content" id="view-container"></main>
      </div>
    </div>

    <!-- Плавающая кнопка документации раздела — вне канваса, поверх всего.
         Видна только там, где для раздела уже есть описание (см. i18n.js: sectionDocs). -->
    <button type="button" class="docs-fab" id="docs-fab" title="">
      <span class="docs-fab-text">Спецификация к разделу</span>
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h6l3 3V16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1Z"/><path d="M12 2.5V6h3M7 10h6M7 13h6"/></svg>
    </button>

    <!-- Полноэкранная спека раздела — открывается кнопкой выше поверх всего приложения -->
    <div class="docs-view" id="docs-view">
      <div class="docs-view-header">
        <button type="button" class="docs-view-close" id="docs-view-close">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 8 8M14 6l-8 8"/></svg>
        </button>
        <div class="docs-view-header-text">
          <span class="docs-view-eyebrow" id="docs-view-eyebrow"></span>
          <h1 class="docs-view-title" id="docs-view-title"></h1>
        </div>
      </div>
      <div class="docs-view-scroll">
        <div class="docs-view-body" id="docs-view-body"></div>
      </div>
    </div>
